name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: Build, test, format
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Repo policy: zero warnings. Enforce it so a new warning fails the build here
      # instead of slipping into master.
      - name: Build (warnings are errors)
        run: dotnet build --nologo --verbosity minimal -warnaserror

      - name: Test
        run: dotnet test --nologo --verbosity normal --no-build

      - name: Format check
        run: dotnet format --verify-no-changes

  # Trust-contract verification: runs a REAL probe -> apply-all -> revert-all -> probe cycle on
  # the ephemeral runner (elevated, throwaway VM) and requires zero persistent residue. This is
  # the only check that exercises the actual Windows registry/powercfg/service behavior end to
  # end. It is a hard gate: its two failures to date were both real revert bugs, and a published
  # release is immutable, so a draft must never be created on top of a failing run.
  revert-symmetry:
    name: Revert symmetry
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build --nologo --verbosity minimal

      - name: Run live revert-symmetry cycle
        env:
          GAMESHIFT_VERIFY_REVERT: '1'
        run: dotnet test --nologo --no-build --filter "FullyQualifiedName~FullSessionCycle" --logger "console;verbosity=detailed"

  # The publish step is the only thing that exercises ReadyToRun, the crossgen2 dedup
  # target, and single-file packaging. It broke silently before 3.8.1 because nothing
  # ran it between releases. Run it on every pull request and on release tags.
  publish:
    name: Publish win-x64 single file
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: dotnet publish src/GameShift.App/GameShift.App.csproj -c Release -r win-x64 --nologo

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "src/GameShift.App/bin/Release/net9.0-windows10.0.19041.0/win-x64/publish/GameShift.App.exe"
          if (-not (Test-Path $exe)) { throw "GameShift.App.exe missing from publish output" }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "Published GameShift.App.exe $($vi.FileVersion) ($([math]::Round((Get-Item $exe).Length / 1MB)) MB)"

      - name: Upload artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: GameShift.App.exe
          path: src/GameShift.App/bin/Release/net9.0-windows10.0.19041.0/win-x64/publish/GameShift.App.exe
          retention-days: 14

  # The installer build: a publish that keeps its native libraries next to the exe instead of
  # extracting them to %TEMP% at startup, packaged by installer/GameShift.iss. Compiled on every
  # run so a broken installer script fails CI, not the release.
  installer:
    name: Installer
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The installed app finds its install folder under the installer's AppId. If the two drift
      # apart, installed copies silently fall back to the portable update path.
      - name: Check installer AppId matches the app
        shell: pwsh
        run: |
          $iss = Get-Content installer/GameShift.iss -Raw
          $cs = Get-Content src/GameShift.Core/Updates/InstallationDetector.cs -Raw
          if ($iss -notmatch '#define AppGuid "([0-9A-Fa-f-]{36})"') { throw "AppGuid not found in installer/GameShift.iss" }
          $issGuid = $Matches[1]
          if ($cs -notmatch 'InstallerAppId\s*=\s*"\{([0-9A-Fa-f-]{36})\}"') { throw "InstallerAppId not found in InstallationDetector.cs" }
          $csGuid = $Matches[1]
          if ($issGuid -ne $csGuid) { throw "installer AppId $issGuid does not match InstallationDetector.InstallerAppId $csGuid" }
          Write-Host "Installer AppId {$issGuid} matches the app"

      - name: Publish (no self-extraction)
        run: dotnet publish src/GameShift.App/GameShift.App.csproj -c Release -r win-x64 --nologo -p:IncludeNativeLibrariesForSelfExtract=false -o artifacts/installer-publish

      # Inno Setup is preinstalled on the Windows runner images (iscc on PATH), but was missing
      # from one image in 2025, so fall back to Chocolatey.
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            Write-Host "iscc not on PATH, installing Inno Setup"
            choco install innosetup -y --no-progress
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
            if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc /Qp installer\GameShift.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed (exit $LASTEXITCODE)" }
          $setup = Get-Item artifacts/installer/GameShift-Setup.exe
          Write-Host "Built GameShift-Setup.exe $($setup.VersionInfo.FileVersion) ($([math]::Round($setup.Length / 1MB)) MB)"

      - name: Upload installer (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: GameShift-Setup.exe
          path: artifacts/installer/GameShift-Setup.exe
          retention-days: 14

  # Drafts the release so a human (or the release flow) only has to paste the CHANGELOG section
  # and press publish. Both assets are required. GameShift.App.exe must keep exactly that name:
  # updaters in 3.8.x and earlier take it by name, and otherwise fall back to any .exe asset,
  # which would be the installer. Tests and the revert check must pass too: nothing is drafted on
  # top of a failing run.
  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, revert-symmetry, publish, installer]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "release-assets/GameShift.App.exe/GameShift.App.exe",
            "release-assets/GameShift-Setup.exe/GameShift-Setup.exe"
          )
          foreach ($asset in $assets) { if (-not (Test-Path $asset)) { throw "Missing release asset $asset" } }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, uploading assets only"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --title "GameShift $($tag.TrimStart('v'))" --notes "Draft created by CI. Replace this text with the CHANGELOG section for $tag, then publish."
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed (exit $LASTEXITCODE)" }
